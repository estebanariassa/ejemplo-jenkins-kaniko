---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-deployment
  labels:
    app: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins
      volumes:
        - name: jenkins-pv-storage
          persistentVolumeClaim:
            claimName: jenkins-pv-claim
      initContainers:
        - name: volume-mount-data-log
          image: busybox
          imagePullPolicy: Always
          command: ["sh", "-c", "chown -R 1000:1000 /var/jenkins_home"]
          volumeMounts:
            - mountPath: "/var/jenkins_home"
              name: jenkins-pv-storage
      containers:
        - name: jenkins
          image: estebanariassa/jenkins-controller-kaniko:latest
          imagePullPolicy: Always
          env:
            - name: JENKINS_ADMIN_ID
              value: admin
            - name: JENKINS_ADMIN_PASSWORD
              value: TU_PASSWORD_JENKINS
          ports:
            - containerPort: 8080
            - containerPort: 50000
          volumeMounts:
            - mountPath: "/var/jenkins_home"
              name: jenkins-pv-storage
      imagePullSecrets:
        - name: regcred